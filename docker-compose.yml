services:
  db:
    image: mysql:8.4
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_DATABASE: pr_media
      MYSQL_USER: pr_media
      MYSQL_PASSWORD: pr_media
      MYSQL_ROOT_PASSWORD: change-root-password
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pchange-root-password"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - mysql_data:/var/lib/mysql

  app:
    build: .
    ports:
      - "3007:3007"
    environment:
      PORT: 3007
      DB_CLIENT: mysql
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_DATABASE: pr_media
      MYSQL_USER: pr_media
      MYSQL_PASSWORD: pr_media
      SESSION_SECRET: change-this-in-production
      # AI Gemini (tùy chọn): đặt GEMINI_API_KEY để bật tính năng AI; giống biến dùng trên Cloud Run
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads_data:/app/data/uploads

volumes:
  mysql_data:
  uploads_data:
